receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # LiteLLM's OpenTelemetry v2 spans leave a successful span's status unset; this demo reports OK, like
  # the notebook's own spans. Azure Monitor derives ResultCode from the span status unless a span is
  # HTTP- or RPC-typed, and would store OK as ResultCode 1, which the Foundry trace view flags as an
  # error. So:
  # - each agent-route request is named after its operation, "POST /foundry-agent/<agent>/<operation>",
  #   instead of the catch-all route template, and reports its HTTP status as ResultCode;
  # - LiteLLM's other non-database spans (auth, chat <model>) carry rpc.system=litellm, so ResultCode
  #   is 0;
  # - database spans (postgres, batch_write_to_db) keep the unset status, since Azure Monitor derives
  #   their ResultCode from it. Error statuses are never changed.
  transform/litellm_status:
    error_mode: ignore
    trace_statements:
      - set(span.attributes["http.route"], span.attributes["url.path"]) where span.kind == SPAN_KIND_SERVER and IsMatch(span.attributes["url.path"], "^/foundry-agent/(main|sentinel)/(conversations|responses)$")
      - set(span.name, Concat([span.attributes["http.request.method"], span.attributes["http.route"]], " ")) where span.kind == SPAN_KIND_SERVER and IsMatch(span.attributes["http.route"], "^/foundry-agent/(main|sentinel)/(conversations|responses)$")
      - set(span.attributes["rpc.system"], "litellm") where span.kind != SPAN_KIND_SERVER and span.attributes["rpc.system"] == nil and span.attributes["db.system.name"] == nil and span.attributes["http.request.method"] == nil
      - set(span.status.code, STATUS_CODE_OK) where span.status.code == STATUS_CODE_UNSET and span.kind == SPAN_KIND_SERVER and span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] < 400
      - set(span.status.code, STATUS_CODE_OK) where span.status.code == STATUS_CODE_UNSET and span.attributes["rpc.system"] == "litellm"
  batch:
    timeout: 5s

exporters:
  # Same Application Insights resource as the notebook, so LiteLLM spans join its traces.
  azure_monitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
    maxbatchinterval: 5s

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/litellm_status, batch]
      exporters: [azure_monitor]
