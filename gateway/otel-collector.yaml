receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # LiteLLM marks successful spans with status OK. The Azure Monitor exporter writes that
  # status (1) into ResultCode, and the Foundry trace view flags non-zero codes as errors.
  # Reset OK to UNSET (ResultCode 0, like Foundry's own spans); real ERROR spans stay errors.
  transform/litellm_status:
    error_mode: ignore
    trace_statements:
      - set(span.status.code, STATUS_CODE_UNSET) where span.status.code == STATUS_CODE_OK
  batch:
    timeout: 5s

exporters:
  # Same Application Insights resource as the notebook, so LiteLLM spans join its traces.
  azure_monitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
    maxbatchinterval: 5s

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/litellm_status, batch]
      exporters: [azure_monitor]
