<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1060" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <filter id="gV" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.45"/></filter>
    <filter id="gC" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22d3ee" flood-opacity="0.45"/></filter>
    <filter id="gM" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.45"/></filter>
    <filter id="gGo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fbbf24" flood-opacity="0.45"/></filter>
    <filter id="gO" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fb923c" flood-opacity="0.45"/></filter>
    <filter id="gR" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f87171" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1020" height="1060" fill="url(#bg)"/>

  <!-- Title -->
  <text x="56" y="58" font-size="30" font-weight="800" fill="#e8edf5" letter-spacing="0.5">NOTEBOOK WALKTHROUGH <tspan font-weight="300" fill="#9aa7ba">// 10 Steps</tspan></text>
  <text x="56" y="80" font-size="12" fill="#6b7689" letter-spacing="0.3">Run top to bottom · setup → observability → agent + MCP → workflow → cleanup</text>
  <circle cx="900" cy="50" r="5" fill="#34d399" filter="url(#gR)" opacity="0"/>
  <line x1="56" y1="96" x2="964" y2="96" stroke="#1c2740" stroke-width="1"/>

  <!-- Rail -->
  <line x1="120" y1="150" x2="120" y2="942" stroke="#2a3a57" stroke-width="2"/>

  <!-- Step 0 violet -->
  <line x1="138" y1="150" x2="160" y2="150" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="150" r="18" fill="#0e1626" stroke="#a855f7" stroke-width="1.6" filter="url(#gV)"/>
  <text x="120" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#c4a5f5">0</text>
  <rect x="160" y="118" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#a855f7" stroke-width="1.3" filter="url(#gV)"/>
  <text x="182" y="146" font-size="13.5" font-weight="700" fill="#e3e9f2">Create / reuse .venv &amp; register kernel</text>
  <text x="182" y="166" font-size="11" fill="#9aa7ba">Project-local virtual environment plus a Jupyter kernel for the PoC</text>
  <rect x="838" y="138" width="108" height="24" rx="12" fill="#1a1130" stroke="#7c3aed" stroke-width="0.9"/><text x="892" y="154" text-anchor="middle" font-size="10" font-weight="600" fill="#cdb6f7">SETUP</text>

  <!-- Step 1 violet -->
  <line x1="138" y1="238" x2="160" y2="238" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="238" r="18" fill="#0e1626" stroke="#a855f7" stroke-width="1.6" filter="url(#gV)"/>
  <text x="120" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#c4a5f5">1</text>
  <rect x="160" y="206" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#a855f7" stroke-width="1.3" filter="url(#gV)"/>
  <text x="182" y="234" font-size="13.5" font-weight="700" fill="#e3e9f2">Install Python dependencies</text>
  <text x="182" y="254" font-size="11" fill="#9aa7ba">Agent Framework, MCP, OpenTelemetry, orchestrations, ipykernel</text>
  <rect x="838" y="226" width="108" height="24" rx="12" fill="#1a1130" stroke="#7c3aed" stroke-width="0.9"/><text x="892" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#cdb6f7">SETUP</text>

  <!-- Step 2 cyan -->
  <line x1="138" y1="326" x2="160" y2="326" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="326" r="18" fill="#0e1626" stroke="#22d3ee" stroke-width="1.6" filter="url(#gC)"/>
  <text x="120" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#67e8f9">2</text>
  <rect x="160" y="294" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#22d3ee" stroke-width="1.3" filter="url(#gC)"/>
  <text x="182" y="322" font-size="13.5" font-weight="700" fill="#e3e9f2">Configure Azure OpenAI &amp; authenticate</text>
  <text x="182" y="342" font-size="11" fill="#9aa7ba">Resolve endpoint / deployment, then sign in with Azure CLI</text>
  <rect x="824" y="314" width="122" height="24" rx="12" fill="#0a2a30" stroke="#0891b2" stroke-width="0.9"/><text x="885" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#a5f0fa">CONFIG</text>

  <!-- Step 3 orange -->
  <line x1="138" y1="414" x2="160" y2="414" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="414" r="18" fill="#0e1626" stroke="#fb923c" stroke-width="1.6" filter="url(#gO)"/>
  <text x="120" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#fdba74">3</text>
  <rect x="160" y="382" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#fb923c" stroke-width="1.3" filter="url(#gO)"/>
  <text x="182" y="410" font-size="13.5" font-weight="700" fill="#e3e9f2">Start the Aspire Dashboard</text>
  <text x="182" y="430" font-size="11" fill="#9aa7ba">Launch the container, surface the browser token / login URL</text>
  <rect x="800" y="402" width="146" height="24" rx="12" fill="#2a1608" stroke="#c2410c" stroke-width="0.9"/><text x="873" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#fed7aa">OBSERVABILITY</text>

  <!-- Step 3.1 orange -->
  <line x1="138" y1="502" x2="160" y2="502" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="502" r="18" fill="#0e1626" stroke="#fb923c" stroke-width="1.6" filter="url(#gO)"/>
  <text x="120" y="507" text-anchor="middle" font-size="11" font-weight="700" fill="#fdba74">3.1</text>
  <rect x="160" y="470" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#fb923c" stroke-width="1.3" filter="url(#gO)"/>
  <text x="182" y="498" font-size="13.5" font-weight="700" fill="#e3e9f2">Enable OpenTelemetry</text>
  <text x="182" y="518" font-size="11" fill="#9aa7ba">Turn on instrumentation and a notebook-friendly logging profile</text>
  <rect x="800" y="490" width="146" height="24" rx="12" fill="#2a1608" stroke="#c2410c" stroke-width="0.9"/><text x="873" y="506" text-anchor="middle" font-size="10" font-weight="600" fill="#fed7aa">OBSERVABILITY</text>

  <!-- Step 4 magenta -->
  <line x1="138" y1="590" x2="160" y2="590" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="590" r="18" fill="#0e1626" stroke="#ec4899" stroke-width="1.6" filter="url(#gM)"/>
  <text x="120" y="595" text-anchor="middle" font-size="14" font-weight="700" fill="#f9a8d4">4</text>
  <rect x="160" y="558" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#ec4899" stroke-width="1.3" filter="url(#gM)"/>
  <text x="182" y="586" font-size="13.5" font-weight="700" fill="#e3e9f2">Create a tool-backed agent</text>
  <text x="182" y="606" font-size="11" fill="#9aa7ba">Agent Framework agent wired to local @tool functions</text>
  <rect x="838" y="578" width="108" height="24" rx="12" fill="#2a0f22" stroke="#be185d" stroke-width="0.9"/><text x="892" y="594" text-anchor="middle" font-size="10" font-weight="600" fill="#fbcfe8">AGENT</text>

  <!-- Step 4.1 magenta -->
  <line x1="138" y1="678" x2="160" y2="678" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="678" r="18" fill="#0e1626" stroke="#ec4899" stroke-width="1.6" filter="url(#gM)"/>
  <text x="120" y="683" text-anchor="middle" font-size="11" font-weight="700" fill="#f9a8d4">4.1</text>
  <rect x="160" y="646" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#ec4899" stroke-width="1.3" filter="url(#gM)"/>
  <text x="182" y="674" font-size="13.5" font-weight="700" fill="#e3e9f2">Run the basic agent</text>
  <text x="182" y="694" font-size="11" fill="#9aa7ba">First streamed prompt captured under a manual notebook span</text>
  <rect x="838" y="666" width="108" height="24" rx="12" fill="#2a0f22" stroke="#be185d" stroke-width="0.9"/><text x="892" y="682" text-anchor="middle" font-size="10" font-weight="600" fill="#fbcfe8">AGENT</text>

  <!-- Step 5 magenta -->
  <line x1="138" y1="766" x2="160" y2="766" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="766" r="18" fill="#0e1626" stroke="#ec4899" stroke-width="1.6" filter="url(#gM)"/>
  <text x="120" y="771" text-anchor="middle" font-size="14" font-weight="700" fill="#f9a8d4">5</text>
  <rect x="160" y="734" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#ec4899" stroke-width="1.3" filter="url(#gM)"/>
  <text x="182" y="762" font-size="13.5" font-weight="700" fill="#e3e9f2">Generate &amp; run the MCP server</text>
  <text x="182" y="782" font-size="11" fill="#9aa7ba">Write the helper script, expose the agent via agent.as_mcp_server()</text>
  <rect x="850" y="754" width="96" height="24" rx="12" fill="#2a0f22" stroke="#be185d" stroke-width="0.9"/><text x="898" y="770" text-anchor="middle" font-size="10" font-weight="600" fill="#fbcfe8">MCP</text>

  <!-- Step 6 gold -->
  <line x1="138" y1="854" x2="160" y2="854" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="854" r="18" fill="#0e1626" stroke="#fbbf24" stroke-width="1.6" filter="url(#gGo)"/>
  <text x="120" y="859" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">6</text>
  <rect x="160" y="822" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.3" filter="url(#gGo)"/>
  <text x="182" y="850" font-size="13.5" font-weight="700" fill="#e3e9f2">Build &amp; run the multi-agent workflow</text>
  <text x="182" y="870" font-size="11" fill="#9aa7ba">GroupChat orchestration with streamed, turn-by-turn telemetry</text>
  <rect x="822" y="842" width="124" height="24" rx="12" fill="#2a2208" stroke="#b45309" stroke-width="0.9"/><text x="884" y="858" text-anchor="middle" font-size="10" font-weight="600" fill="#fde68a">WORKFLOW</text>

  <!-- Step 7 red -->
  <line x1="138" y1="942" x2="160" y2="942" stroke="#2a3a57" stroke-width="1.4"/>
  <circle cx="120" cy="942" r="18" fill="#0e1626" stroke="#f87171" stroke-width="1.6" filter="url(#gR)"/>
  <text x="120" y="947" text-anchor="middle" font-size="14" font-weight="700" fill="#fecaca">7</text>
  <rect x="160" y="910" width="804" height="64" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#f87171" stroke-width="1.3" filter="url(#gR)"/>
  <text x="182" y="938" font-size="13.5" font-weight="700" fill="#e3e9f2">Cleanup</text>
  <text x="182" y="958" font-size="11" fill="#9aa7ba">Stop the MCP process, remove Aspire container / image, close credential</text>
  <rect x="828" y="930" width="118" height="24" rx="12" fill="#2a1010" stroke="#b91c1c" stroke-width="0.9"/><text x="887" y="946" text-anchor="middle" font-size="10" font-weight="600" fill="#fecaca">CLEANUP</text>

  <text x="964" y="1010" text-anchor="end" font-size="10" fill="#5b6678">agent-framework-demo · notebook walkthrough · 2026</text>
</svg>
