  <rect x="30" y="928" width="1340" height="86" rx="12" fill="#0e1626" fill-opacity="0.92" stroke="#fb923c" stroke-width="1.2" filter="url(#gorange)"/>
  <text x="50" y="952" font-size="9" font-weight="700" letter-spacing="0.8" fill="#fdba74">COLLECTOR STATUS RULES</text>
  <text x="50" y="974" font-size="10.5" fill="#b8c2d2">OpenTelemetry v2 leaves successful spans unset; the Collector reports them OK. Azure Monitor stores OK as ResultCode 1 unless a span is HTTP or RPC typed, which the Foundry trace view flags.</text>
  <circle cx="54" cy="992" r="2" fill="#fb923c"/>
  <text x="64" y="996" font-size="10.5" fill="#fed7aa">Agent-route request → POST &lt;path&gt; · ResultCode = HTTP status</text>
  <circle cx="494" cy="992" r="2" fill="#fb923c"/>
  <text x="504" y="996" font-size="10.5" fill="#fed7aa">auth and chat spans → rpc.system=litellm · ResultCode 0</text>
  <circle cx="934" cy="992" r="2" fill="#fb923c"/>
  <text x="944" y="996" font-size="10.5" fill="#fed7aa">Neon spans stay unset · errors never change</text>
