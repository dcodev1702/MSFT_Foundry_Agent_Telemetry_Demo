  <text x="50" y="1124" font-size="10.5" fill="#b8c2d2">Section 3.1 sets telemetry up once per kernel. A rerun with the same settings reuses the provider; any change needs a kernel restart, since a provider cannot adopt a new identity.</text>
  <circle cx="54" cy="1142" r="2" fill="#a855f7"/>
  <text x="64" y="1146" font-size="10.5" fill="#cdb6f7">Changed service.version or content policy → restart</text>
